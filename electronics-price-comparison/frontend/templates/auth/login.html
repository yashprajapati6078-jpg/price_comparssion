{% extends 'base.html' %}

{% block title %}User Login | ElectroCompare{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="bg-primary-subtle text-primary d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 60px; height: 60px;">
                            <i class="bi bi-box-arrow-in-right fs-2"></i>
                        </div>
                        <h3 class="fw-bold">Welcome Back</h3>
                        <p class="text-muted fs-sm">Login to manage your Wishlist and Price Alerts</p>
                    </div>

                    <form action="{{ url_for('login') }}" method="POST">
                        <div class="mb-3">
                            <label for="usernameInput" class="form-label fw-semibold">Username or Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                                <input type="text" name="username" id="usernameInput" class="form-control bg-light border-start-0" placeholder="Enter username or email" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="passwordInput" class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                <input type="password" name="password" id="passwordInput" class="form-control bg-light border-start-0" placeholder="Enter password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold mb-3">
                            Login <i class="bi bi-arrow-right ms-1"></i>
                        </button>
                    </form>

                    <div class="text-center pt-3 border-top">
                        <p class="text-muted fs-sm mb-0">
                            Don't have an account? <a href="{{ url_for('register') }}" class="fw-bold text-primary text-decoration-none">Register now</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
