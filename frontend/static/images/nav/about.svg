<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="goldSphere" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <linearGradient id="glossHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#78350f" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 3D Shadow Base -->
  <ellipse cx="50" cy="88" rx="30" ry="6" fill="#000000" opacity="0.2" filter="blur(4px)"/>

  <!-- 3D Main Sphere -->
  <circle cx="50" cy="48" r="38" fill="url(#goldSphere)" filter="url(#shadow3d)"/>

  <!-- Top Gloss Highlight Ring -->
  <path d="M 20,34 A 34,34 0 0,1 80,34 A 34,18 0 0,0 20,34 Z" fill="url(#glossHighlight)"/>

  <!-- Embossed 3D Info Symbol -->
  <circle cx="50" cy="28" r="5" fill="#ffffff" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.4))"/>
  <rect x="45" y="39" width="10" height="26" rx="5" fill="#ffffff" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.4))"/>
</svg>
